<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            width: 300px;
            box-shadow: 0px 0px 10px #ccc;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
        }

        button {
            width: 100%;
            padding: 10px;
            background: black;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }

        .msg {
            margin-top: 10px;
            color: red;
        }
    </style>
</head>

<body>

<div class="box">
    <h2>Admin Login</h2>

    <form id="loginForm">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>

    <div class="msg" id="msg"></div>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    let formData = new FormData(this);

    try {
        let res = await fetch("http://127.0.0.1:8000/login", {
            method: "POST",
            body: formData
        });

        if (!res.ok) {
            document.getElementById("msg").innerText = "Invalid username or password";
            return;
        }

        let data = await res.json();

        if (data.role === "admin") {
            localStorage.setItem("role", "admin");
            window.location.href = "admin/dashboard.html";
        } else {
            document.getElementById("msg").innerText = "Access denied";
        }

    } catch (error) {
        document.getElementById("msg").innerText = "Server not running";
    }
});
</script>

</body>
</html>
